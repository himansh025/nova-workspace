name: Gemini Code Agent

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Analyze this repository and act as a senior software engineer.

            Investigate the current issue described below.

            ISSUE:
            After a pull request is merged, the notification toast
            appears correctly, but the notification bell/unread count
            does not reliably refresh.

            Known relevant files:
            - frontend/src/app/app/pull-requests/page.tsx
            - frontend/src/components/workspace/NotificationCenter.tsx

            Do not assume these are the only relevant files.

            Investigate the entire notification architecture.

            Check:
            - notification creation
            - notification APIs
            - SSE implementation
            - notification refresh mechanism
            - unread count calculation
            - merge flow
            - React state management
            - event subscriptions
            - frontend/backend communication

            Find the actual root cause before changing anything.

            Expected behavior:
            1. User merges a pull request.
            2. Merge succeeds.
            3. Notification toast appears.
            4. Notification refresh event is triggered.
            5. NotificationCenter receives the event.
            6. Notification history/unread count refreshes.
            7. The notification bell immediately shows the correct count.

            IMPORTANT:
            - Do not modify seed/demo data.
            - Do not make unrelated changes.
            - Do not rewrite working architecture unnecessarily.
            - Make the smallest production-safe fix.
            - Inspect all relevant files before making changes.

            After implementing the fix:
            1. Run relevant tests.
            2. Run TypeScript/type checking if available.
            3. Run the appropriate build if practical.
            4. Review the git diff.
            5. Explain the exact root cause.
            6. Explain the fix.
            7. List every modified file.
            8. Report any tests or checks that could not be run.
